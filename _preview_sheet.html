<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #12141a;
    font-family: "Hiragino Kaku Gothic ProN", sans-serif;
    padding: 44px 40px 56px;
    color: #fff;
  }
  h1 { font-size: 30px; font-weight: 900; letter-spacing: .02em; }
  .sub { font-size: 15px; color: #8b93a1; margin-top: 10px; margin-bottom: 34px; line-height: 1.8; }
  .row { display: flex; gap: 26px; align-items: flex-start; }
  .col { }
  .cap {
    font-size: 15px; font-weight: 800; margin-bottom: 4px;
  }
  .cap span { color: #ff8f8f; }
  .path { font-size: 12px; color: #6f7683; margin-bottom: 12px; letter-spacing: .04em; }
  .frame {
    width: 480px;
    border-radius: 10px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 18px 50px rgba(0,0,0,.5);
    position: relative;
  }
  iframe { width: 1440px; border: 0; transform: scale(0.333333); transform-origin: 0 0; display: block; }
</style>
</head>
<body>
  <h1>株式会社ナトビー コーポレートサイト リニューアル版</h1>
  <p class="sub">
    ブランチ renewal-2026-07 ／ 公開中のサイト（natobe.pages.dev）はまだ差し替えていません。<br>
    ページ全体を縮小して並べたものです。実物はPC・スマホどちらでも表示確認済み。
  </p>
  <div class="row">
    <div class="col">
      <p class="cap">① トップ<span>（新規：事業内容3本立て）</span></p>
      <p class="path">index.html</p>
      <div class="frame" style="height:2434px"><iframe src="http://127.0.0.1:8899/index.html" style="height:7300px" scrolling="no"></iframe></div>
    </div>
    <div class="col">
      <p class="cap">② 研修ページ<span>（新設）</span></p>
      <p class="path">training.html</p>
      <div class="frame" style="height:1834px"><iframe src="http://127.0.0.1:8899/training.html" style="height:5500px" scrolling="no"></iframe></div>
    </div>
    <div class="col">
      <p class="cap">③ 会社概要</p>
      <p class="path">company.html</p>
      <div class="frame" style="height:844px"><iframe src="http://127.0.0.1:8899/company.html" style="height:2530px" scrolling="no"></iframe></div>
      <p class="cap" style="margin-top:26px">④ お問い合わせ</p>
      <p class="path">contact.html</p>
      <div class="frame" style="height:504px"><iframe src="http://127.0.0.1:8899/contact.html" style="height:1510px" scrolling="no"></iframe></div>
    </div>
  </div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Natobe icon v2 variants</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 1080px; background: #fff; color: #0B2E3D; }
body { font-family: Arial, sans-serif; }
main { width: 1080px; padding: 0 52px; background: #fff; }
.variant {
  min-height: 252px;
  display: grid;
  grid-template-columns: 56px 220px 96px 96px 48px;
  column-gap: 46px;
  align-items: center;
  border-bottom: 1px solid #dbe7ea;
}
.label { font-size: 22px; font-weight: 700; }
img { display: block; }
.sns { width: 96px; height: 96px; overflow: hidden; border-radius: 50%; }
</style>
</head>
<body><main>
<div class="variant">
  <div class="label">v0</div>
  <img src="icon-v0.svg" width="220" height="220" alt="v0 at 220px">
  <img src="icon-v0.svg" width="96" height="96" alt="v0 at 96px">
  <div class="sns"><img src="icon-v0.svg" width="96" height="96" alt="v0 circular preview"></div>
  <img src="icon-v0.svg" width="48" height="48" alt="v0 at 48px">
</div>
<div class="variant">
  <div class="label">v1</div>
  <img src="icon-v1.svg" width="220" height="220" alt="v1 at 220px">
  <img src="icon-v1.svg" width="96" height="96" alt="v1 at 96px">
  <div class="sns"><img src="icon-v1.svg" width="96" height="96" alt="v1 circular preview"></div>
  <img src="icon-v1.svg" width="48" height="48" alt="v1 at 48px">
</div>
<div class="variant">
  <div class="label">v2</div>
  <img src="icon-v2.svg" width="220" height="220" alt="v2 at 220px">
  <img src="icon-v2.svg" width="96" height="96" alt="v2 at 96px">
  <div class="sns"><img src="icon-v2.svg" width="96" height="96" alt="v2 circular preview"></div>
  <img src="icon-v2.svg" width="48" height="48" alt="v2 at 48px">
</div>
<div class="variant">
  <div class="label">v3</div>
  <img src="icon-v3.svg" width="220" height="220" alt="v3 at 220px">
  <img src="icon-v3.svg" width="96" height="96" alt="v3 at 96px">
  <div class="sns"><img src="icon-v3.svg" width="96" height="96" alt="v3 circular preview"></div>
  <img src="icon-v3.svg" width="48" height="48" alt="v3 at 48px">
</div>
<div class="variant">
  <div class="label">v4</div>
  <img src="icon-v4.svg" width="220" height="220" alt="v4 at 220px">
  <img src="icon-v4.svg" width="96" height="96" alt="v4 at 96px">
  <div class="sns"><img src="icon-v4.svg" width="96" height="96" alt="v4 circular preview"></div>
  <img src="icon-v4.svg" width="48" height="48" alt="v4 at 48px">
</div>
<div class="variant">
  <div class="label">v5</div>
  <img src="icon-v5.svg" width="220" height="220" alt="v5 at 220px">
  <img src="icon-v5.svg" width="96" height="96" alt="v5 at 96px">
  <div class="sns"><img src="icon-v5.svg" width="96" height="96" alt="v5 circular preview"></div>
  <img src="icon-v5.svg" width="48" height="48" alt="v5 at 48px">
</div>
</main></body>
</html>
